# AIDEV-NOTE: Pushing a v* tag triggers release. Dependabot updates each action's pinned SHA and version comment together.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
          skip-cache: true
      - run: make check
      - name: Build the tagged release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        with:
          version: v2.20.0
          args: release --clean --skip=publish
      - run: make package-smoke
      - name: Check the asset names against the tag
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for file in "taskronin_${VERSION}_linux_amd64.tar.gz" \
                      "taskronin_${VERSION}_linux_arm64.tar.gz" \
                      "taskronin_${VERSION}_amd64.deb" \
                      "taskronin_${VERSION}_arm64.deb" \
                      "taskronin_${VERSION}_source.tar.gz" checksums.txt; do
            if [[ ! -f "$file" ]]; then
              echo "Missing release asset: $file" >&2
              exit 1
            fi
          done
      - name: Select release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          notes="docs/release-notes/$VERSION.md"
          if [[ -f "$notes" ]]; then
            cp "$notes" dist/RELEASE_NOTES.md
          else
            cp dist/CHANGELOG.md dist/RELEASE_NOTES.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
            dist/RELEASE_NOTES.md

  # AIDEV-NOTE: This job holds the write and signing rights. Never check out or execute repository code here.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - run: sha256sum -c checksums.txt
        working-directory: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Create the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cat >> RELEASE_NOTES.md <<'FOOTER'


          Verify a download with `gh attestation verify <file> --repo linsomniac/taskronin`, or compare it with `checksums.txt`.
          FOOTER
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md "${flags[@]}" \
            "taskronin_${VERSION}_linux_amd64.tar.gz" \
            "taskronin_${VERSION}_linux_arm64.tar.gz" \
            "taskronin_${VERSION}_amd64.deb" \
            "taskronin_${VERSION}_arm64.deb" \
            "taskronin_${VERSION}_source.tar.gz" checksums.txt
